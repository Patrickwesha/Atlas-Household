<!DOCTYPE html>
<!--
  Atlas Household — kiosk design prototype (reference only, NOT shipped code).

  This is the visual mock the shipped kiosk in apps/web is styled from. It is
  committed so the design intent has a home in the repo, and so changes to the
  real UI can be diffed against something.

  DATED SNAPSHOT. The times in here are the ones that were current when this
  mock was drawn and are NOT kept in sync with production. In particular the
  nightly family reset moved to 9:30 PM (practice runs 6:30-8:30, so an 8pm
  reset is one nobody can be at) — the shipped app derives that from RESET_AT
  in apps/web/src/clock.ts, which is the only source of truth for it. Do not
  diff this file against the app and "fix" the app back.

  Two things to know before reading it:

  1. NAMES ARE PLACEHOLDERS. The originals were replaced with the same
     placeholder names used in apps/api/seed.example.json. This repo is public;
     real family data does not go in it. See CLAUDE.md.

  2. IT IS FULL OF HARDCODED MOCK DATA, and several things in here were
     DELIBERATELY NOT SHIPPED because the backend cannot honor them:

       - Due times ("By 9:30 PM"). chore_instances has due_on (a DATE). There
         is no cutoff-time column, so a time here would be invented.
       - Escalation copy ("... gets a nudge if it's missed", "... was told").
         There is no notification service. This would be a promise the app
         cannot keep.
       - The Calendar tab. Its per-day history is a seeded random number
         (see the p.hist block). There is no history endpoint yet, so the tab
         is hidden entirely rather than shipped fake or shipped empty.
       - The subtasks / steps expander. There is no chore_subtask_instances
         table.
       - A task count on, and tappability of, the dependent member. The API
         rejects a dependent completing a chore; the UI must not offer it.

     If you are porting something from this file, check that list first.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas — Our Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6A4CF0;
    --violet-2:#8B4EEE;
    --magenta:#B44CE8;
    --gold:#FFC53D;
    --green:#1FB582;
    --pink:#F4457B;
    --ink:#231C3B;
    --grey:#8E89A6;
    --wash:#F4F2FB;
    --ring-empty:#E7E3F6;
    --pad:clamp(16px,2vw,30px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--magenta) 0%,var(--violet-2) 42%,var(--violet) 100%);
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  :focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:10px;}

  #app{height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;}
  .screen{display:none;flex:1;flex-direction:column;min-height:0;}
  .screen.on{display:flex;animation:in .3s ease;}
  @keyframes in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* ---------- shared header ---------- */
  .head{
    flex:0 0 auto;
    padding:var(--pad) var(--pad) calc(var(--pad) - 4px);
    color:#fff;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .head h1{
    font-size:clamp(26px,3.2vw,44px);
    font-weight:800;
    margin:0;
    letter-spacing:-.01em;
  }
  .head .sub{font-size:clamp(13px,1.3vw,18px);opacity:.82;font-weight:600;}
  .head .right{margin-left:auto;text-align:right;}
  .head .clock{font-size:clamp(20px,2.4vw,34px);font-weight:800;font-variant-numeric:tabular-nums;}

  /* ---------- family screen ---------- */
  .people{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:clamp(10px,1.4vw,22px);
    padding:0 var(--pad);
    align-content:center;
  }
  .pcard{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:clamp(14px,1.8vw,26px) 10px;
    border-radius:26px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.22);
    color:#fff;
    transition:transform .16s ease, background .2s ease;
  }
  .pcard:active{transform:scale(.97);background:rgba(255,255,255,.2);}
  .ring{
    position:relative;
    width:clamp(96px,12vw,168px);
    aspect-ratio:1;
    border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,.28) 0);
    padding:7px;
  }
  .ring .inner{
    width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#fff;
    display:grid;place-items:center;
  }
  .ring svg{width:100%;height:100%;display:block;}
  .pcard .nm{font-size:clamp(17px,1.9vw,27px);font-weight:800;}
  .pcard .cnt{
    font-size:clamp(12px,1.15vw,16px);
    font-weight:700;
    padding:5px 13px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
  }
  .pcard.clear .cnt{background:var(--gold);color:#4A3200;}

  /* ---------- white sheet ---------- */
  .sheet{
    flex:0 0 auto;
    background:#fff;
    border-radius:30px 30px 0 0;
    padding:var(--pad);
    margin-top:var(--pad);
    box-shadow:0 -14px 40px rgba(40,18,90,.22);
  }
  .sheet.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

  .strip{display:flex;align-items:center;gap:16px;}
  .strip .bell{
    width:clamp(42px,4.4vw,58px);aspect-ratio:1;border-radius:50%;
    background:var(--wash);display:grid;place-items:center;font-size:clamp(20px,2.2vw,28px);
  }
  .strip .t{font-size:clamp(16px,1.7vw,23px);font-weight:800;}
  .strip .s{font-size:clamp(12px,1.25vw,16px);color:var(--grey);font-weight:600;}
  .strip .cd{
    margin-left:auto;
    font-size:clamp(15px,1.7vw,23px);font-weight:800;color:var(--violet);
    background:var(--wash);padding:10px 18px;border-radius:999px;white-space:nowrap;
  }

  /* ---------- person header ---------- */
  .back{
    width:clamp(46px,4.6vw,60px);aspect-ratio:1;flex:0 0 auto;
    border-radius:50%;background:rgba(255,255,255,.2);
    color:#fff;font-size:24px;display:grid;place-items:center;
  }
  .phead-av{
    width:clamp(58px,6vw,84px);aspect-ratio:1;flex:0 0 auto;
    border-radius:50%;background:#fff;overflow:hidden;
  }
  .phead-av svg{width:100%;height:100%;display:block;}
  .bar{
    margin-top:8px;
    height:11px;width:clamp(180px,26vw,340px);
    border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;
  }
  .bar i{display:block;height:100%;border-radius:999px;background:var(--gold);width:0;transition:width .5s cubic-bezier(.2,.8,.3,1);}

  .tabs{display:flex;gap:8px;margin-left:auto;background:rgba(255,255,255,.16);padding:6px;border-radius:999px;}
  .tab{
    padding:10px clamp(16px,2vw,26px);
    border-radius:999px;font-weight:800;color:#fff;opacity:.8;
    font-size:clamp(13px,1.35vw,18px);
  }
  .tab.on{background:#fff;color:var(--violet);opacity:1;}

  /* ---------- task list ---------- */
  .list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px;-webkit-overflow-scrolling:touch;}
  .task{background:var(--wash);border-radius:22px;overflow:hidden;flex:0 0 auto;transition:background .25s ease;}
  .task.done{background:#E9F8F2;}
  .trow{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:clamp(14px,1.6vw,20px) clamp(16px,1.8vw,24px);min-height:92px;}
  .check{
    width:clamp(40px,4.2vw,52px);aspect-ratio:1;flex:0 0 auto;
    border-radius:50%;border:3px solid #D9D3EE;background:#fff;
    display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800;
    transition:background .2s ease,border-color .2s ease;
  }
  .task.done .check{background:var(--green);border-color:var(--green);}
  .ttl{font-size:clamp(17px,1.85vw,26px);font-weight:700;}
  .task.done .ttl{color:var(--grey);}
  .due{display:block;margin-top:4px;font-size:clamp(12px,1.25vw,16px);font-weight:600;color:var(--grey);}
  .due.late{color:var(--pink);}
  .task.done .due{color:var(--green);}
  .chev{
    margin-left:auto;flex:0 0 auto;align-self:stretch;
    width:clamp(52px,5vw,68px);display:grid;place-items:center;
    color:var(--grey);font-size:15px;
  }
  .chev span{display:block;transition:transform .25s ease;}
  .task.open .chev span{transform:rotate(180deg);}
  .steps{display:none;flex-direction:column;gap:9px;padding:0 24px 20px clamp(74px,8vw,94px);}
  .task.open .steps{display:flex;}
  .step{display:flex;align-items:center;gap:11px;font-size:clamp(14px,1.4vw,19px);font-weight:600;color:var(--grey);}
  .step i{width:9px;height:9px;border-radius:50%;background:var(--violet);opacity:.45;flex:0 0 auto;}

  /* ---------- calendar ---------- */
  .cal{flex:1 1 auto;min-height:0;overflow-y:auto;}
  .cal .mon{display:flex;align-items:center;gap:12px;margin-bottom:clamp(10px,1.4vw,18px);}
  .cal .mon b{font-size:clamp(19px,2vw,28px);font-weight:800;}
  .cal .nav{width:44px;aspect-ratio:1;border-radius:50%;background:var(--wash);display:grid;place-items:center;color:var(--violet);font-size:18px;font-weight:800;}
  .cal .nav.last{margin-left:auto;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,.9vw,14px);}
  .dow{text-align:center;font-size:clamp(11px,1.15vw,15px);font-weight:700;color:var(--grey);padding-bottom:4px;}
  .day{display:grid;place-items:center;}
  .day .r{
    width:clamp(46px,5.2vw,72px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(var(--violet) calc(var(--p)*1%), var(--ring-empty) 0);
    padding:5px;
  }
  .day .r em{
    width:100%;height:100%;border-radius:50%;background:#fff;
    display:grid;place-items:center;
    font-style:normal;font-weight:700;
    font-size:clamp(14px,1.5vw,20px);color:var(--ink);
  }
  .day.full .r em{color:var(--violet);font-weight:800;}
  .day.today .r{background:var(--gold);}
  .day.today .r em{color:#A06E00;font-weight:800;}
  .day.future .r{background:var(--ring-empty);opacity:.5;}
  .day.future .r em{color:#B9B3CE;}
  .legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:clamp(12px,1.6vw,22px);font-size:clamp(12px,1.25vw,16px);font-weight:700;color:var(--grey);}
  .legend span{display:flex;align-items:center;gap:9px;}
  .key{width:22px;height:22px;border-radius:50%;padding:3px;}
  .key em{display:block;width:100%;height:100%;border-radius:50%;background:#fff;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,150%);
    display:flex;align-items:center;gap:18px;
    background:var(--ink);color:#fff;font-weight:700;font-size:17px;
    padding:14px 14px 14px 24px;border-radius:999px;
    box-shadow:0 18px 44px rgba(30,10,70,.4);
    transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:30;
  }
  .toast.show{transform:translate(-50%,0);}
  .toast button{background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;}

  @media (max-width:900px){
    .people{grid-template-columns:repeat(3,1fr);align-content:start;overflow-y:auto;padding-bottom:12px;}
    .tabs{margin-left:0;width:100%;order:5;}
    .head{flex-wrap:wrap;}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ FAMILY ============ -->
  <section class="screen on" id="s-family">
    <div class="head">
      <div>
        <h1>Our family</h1>
        <div class="sub" id="famdate">—</div>
      </div>
      <div class="right"><div class="clock" id="clock">—</div></div>
    </div>
    <div class="people" id="people"></div>
    <div class="sheet">
      <div class="strip">
        <div class="bell">🧹</div>
        <div>
          <div class="t">15-minute family reset</div>
          <div class="s">Everyone, every night at 8:00 PM</div>
        </div>
        <div class="cd" id="countdown">—</div>
      </div>
    </div>
  </section>

  <!-- ============ PERSON ============ -->
  <section class="screen" id="s-person">
    <div class="head">
      <button class="back" id="back" aria-label="Back to the family">←</button>
      <div class="phead-av" id="pav"></div>
      <div>
        <h1 id="pname">—</h1>
        <div class="sub" id="pcount">—</div>
        <div class="bar"><i id="pbar"></i></div>
      </div>
      <div class="tabs">
        <button class="tab on" id="tab-today">Today</button>
        <button class="tab" id="tab-cal">Calendar</button>
      </div>
    </div>
    <div class="sheet grow">
      <div class="list" id="list"></div>
      <div class="cal" id="cal" style="display:none"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button id="undo">Undo</button>
</div>

<script>
/* ============ avatars ============ */
const SKIN=["#F0C49B","#8D5524","#C68642","#5C3A21","#F5D0B0"];
function avatar(o){
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
    '<rect width="100" height="100" fill="'+o.bg+'"/>'+
    '<circle cx="50" cy="112" r="46" fill="'+o.shirt+'"/>'+
    '<path d="M38 66h24v18H38z" fill="'+o.skin+'"/>'+
    '<ellipse cx="50" cy="46" rx="26" ry="29" fill="'+o.skin+'"/>'+
    o.hair+
    '<ellipse cx="40" cy="47" rx="6.4" ry="7.4" fill="#fff"/>'+
    '<ellipse cx="60" cy="47" rx="6.4" ry="7.4" fill="#fff"/>'+
    '<circle cx="40.6" cy="48" r="4.2" fill="'+o.eye+'"/>'+
    '<circle cx="60.6" cy="48" r="4.2" fill="'+o.eye+'"/>'+
    '<circle cx="42" cy="46.4" r="1.5" fill="#fff"/>'+
    '<circle cx="62" cy="46.4" r="1.5" fill="#fff"/>'+
    '<path d="M43 60q7 6 14 0" stroke="#8A4A38" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
  '</svg>';
}
const HAIR={
  short:c=>'<path d="M24 44c0-17 12-27 26-27s26 10 26 27c0-9-10-13-26-13S24 35 24 44z" fill="'+c+'"/>',
  fade: c=>'<path d="M25 42c1-16 12-25 25-25s24 9 25 25c-4-6-13-9-25-9s-21 3-25 9z" fill="'+c+'"/>',
  curls:c=>'<path d="M24 43c0-18 12-26 26-26s26 8 26 26c-3-7-8-10-13-8-4-6-22-6-26 0-5-2-10 1-13 8z" fill="'+c+'"/><circle cx="30" cy="30" r="8" fill="'+c+'"/><circle cx="50" cy="22" r="9" fill="'+c+'"/><circle cx="70" cy="30" r="8" fill="'+c+'"/>',
  long: c=>'<path d="M22 46c0-19 13-29 28-29s28 10 28 29v30h-9V44c0-8-8-12-19-12s-19 4-19 12v32h-9z" fill="'+c+'"/>',
  tuft: c=>'<path d="M28 42c2-14 11-22 22-22s20 8 22 22c-5-7-13-10-22-10s-17 3-22 10z" fill="'+c+'"/><path d="M52 20c4-6 10-6 12-2-5 0-8 2-9 5z" fill="'+c+'"/>'
};

/* ============ people ============ */
const PEOPLE=[
  {id:"pan",name:"Adult One",kitchen:[1,3,5],av:{bg:"#EDE7FF",skin:SKIN[3],eye:"#3B2A1A",shirt:"#3E5BD4",hair:HAIR.fade("#1A1218")}},
  {id:"nya",name:"Adult Two",kitchen:[2,4,6],av:{bg:"#FDE8F3",skin:SKIN[1],eye:"#3B2A1A",shirt:"#D6427E",hair:HAIR.long("#241018")}},
  {id:"ten",name:"Kid One",trash:[1,3,5],av:{bg:"#E6F6FF",skin:SKIN[2],eye:"#4A3018",shirt:"#2FB0A8",hair:HAIR.curls("#20140E")}},
  {id:"far",name:"Kid Two",trash:[2,4,6],av:{bg:"#FFF2DE",skin:SKIN[1],eye:"#3B2A1A",shirt:"#F08A2E",hair:HAIR.short("#1C1216")}},
  {id:"kud",name:"Dependent One",toddler:true,av:{bg:"#E8FBF2",skin:SKIN[2],eye:"#4A3018",shirt:"#7B5BF2",hair:HAIR.tuft("#241812")}}
];

function buildTasks(p){
  const d=new Date().getDay(), t=[];
  if(p.kitchen&&p.kitchen.includes(d))
    t.push({t:"Kitchen reset",due:"9:30 PM",who:"Adult Two",steps:["Counters wiped down","Dishwasher loaded and running","Sink empty","Stovetop clean"]});
  if(p.trash&&p.trash.includes(d))
    t.push({t:"Take the trash out",due:"7:00 PM",who:"a grown-up",steps:["Kitchen bin to the curb","New bag in the bin","Bathroom bins if they're full"]});
  if(p.id==="pan") t.push(
    {t:"Sort the laundry",steps:["Darks, lights, towels","Anything stained goes in the sink","Basket back to the hall"]},
    {t:"Put away toddler clothes",steps:["Fold on the changing table","Drawers by type, not by outfit"]});
  if(p.id==="nya") t.push(
    {t:"Start a laundry load",steps:["Sort what's in the hall basket","Move yesterday's load to the dryer"]});
  if(p.id==="ten"||p.id==="far") t.push(
    {t:"Backpack and shoes away",due:"5:00 PM",who:"a grown-up",steps:["Shoes on the rack, not the floor","Lunchbox in the sink","Backpack on your hook"]},
    {t:"Pick up your room",due:"7:30 PM",who:"a grown-up",steps:["Floor clear","Clothes in the hamper","Bed made"]});
  if(p.id==="kud") t.push(
    {t:"Toys in the bin",who:"a grown-up",steps:["Blocks in the blue bin","Books on the low shelf"]});
  t.forEach((c,i)=>{c.id=p.id+i;c.done=false;});
  return t;
}
PEOPLE.forEach(p=>{
  p.tasks=buildTasks(p);
  // stand-in history so the calendar has something to show
  p.hist={};
  const today=new Date().getDate();
  for(let d=1;d<today;d++){
    const seed=(d*37+p.id.charCodeAt(0)*13)%100;
    p.hist[d]= seed>62 ? 100 : seed>44 ? 75 : seed>26 ? 50 : seed>12 ? 25 : 0;
  }
});

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const done=p=>p.tasks.filter(t=>t.done).length;
const pct=p=>p.tasks.length?Math.round(done(p)/p.tasks.length*100):0;
function minsTo(str){
  const [tm,ap]=str.split(" ");let[h,m]=tm.split(":").map(Number);
  if(ap==="PM"&&h!==12)h+=12; if(ap==="AM"&&h===12)h=0;
  const n=new Date(),x=new Date(n);x.setHours(h,m,0,0);
  return Math.round((x-n)/60000);
}
const late=t=>t.due&&!t.done&&minsTo(t.due)<0;

let cur=null,view="today",idle=null,last=null,tt=null;

/* ============ family screen ============ */
function renderFamily(){
  const wrap=$("#people");wrap.innerHTML="";
  PEOPLE.forEach(p=>{
    const b=document.createElement("button");
    b.className="pcard"+(pct(p)===100?" clear":"");
    b.setAttribute("aria-label",p.name+", "+done(p)+" of "+p.tasks.length+" done");
    b.innerHTML='<div class="ring" style="--p:'+pct(p)+'"><div class="inner">'+avatar(p.av)+'</div></div>'+
      '<div class="nm">'+p.name+'</div>'+
      '<div class="cnt">'+(pct(p)===100?"All done ✓":done(p)+" of "+p.tasks.length+" done")+'</div>';
    b.addEventListener("click",()=>open(p));
    wrap.appendChild(b);
  });
}

/* ============ person screen ============ */
function open(p){
  cur=p;view="today";
  $("#s-family").classList.remove("on");
  $("#s-person").classList.add("on");
  switchTab("today");
  bump();
}
function close(){
  cur=null;clearTimeout(idle);hideToast();
  $("#s-person").classList.remove("on");
  $("#s-family").classList.add("on");
  renderFamily();
}
$("#back").addEventListener("click",close);

function switchTab(v){
  view=v;
  $("#tab-today").classList.toggle("on",v==="today");
  $("#tab-cal").classList.toggle("on",v==="cal");
  $("#list").style.display=v==="today"?"flex":"none";
  $("#cal").style.display=v==="cal"?"block":"none";
  renderPerson();bump();
}
$("#tab-today").addEventListener("click",()=>switchTab("today"));
$("#tab-cal").addEventListener("click",()=>switchTab("cal"));

function renderPerson(){
  const p=cur;if(!p)return;
  $("#pav").innerHTML=avatar(p.av);
  $("#pname").textContent=p.name;
  $("#pcount").textContent=done(p)+" of "+p.tasks.length+" tasks completed";
  $("#pbar").style.width=pct(p)+"%";
  view==="today"?renderList():renderCal();
}

function renderList(){
  const p=cur,el=$("#list");el.innerHTML="";
  p.tasks.forEach(t=>{
    const row=document.createElement("div");
    row.className="task"+(t.done?" done":"");
    let note="";
    if(t.done) note='<span class="due">Done ✓</span>';
    else if(t.due) note='<span class="due'+(late(t)?" late":"")+'">'+
      (late(t)?"Missed "+t.due+" · "+t.who+" was told":"By "+t.due+" · "+t.who+" gets a nudge if it's missed")+'</span>';
    else if(t.who) note='<span class="due">With '+t.who+'</span>';
    row.innerHTML=
      '<button class="trow"><span class="check">'+(t.done?"✓":"")+'</span>'+
      '<span><span class="ttl">'+t.t+'</span>'+note+'</span></button>'+
      '<button class="chev" aria-label="Show the steps"><span>▾</span></button>'+
      '<div class="steps">'+t.steps.map(s=>'<div class="step"><i></i>'+s+'</div>').join("")+'</div>';
    row.querySelector(".trow").addEventListener("click",()=>toggle(t));
    row.querySelector(".chev").addEventListener("click",e=>{e.stopPropagation();row.classList.toggle("open");bump();});
    el.appendChild(row);
  });
}

function toggle(t){
  t.done=!t.done;renderPerson();bump();
  if(t.done){last=t;showToast(t.t+" — done");}else hideToast();
}

function renderCal(){
  const p=cur,now=new Date(),y=now.getFullYear(),m=now.getMonth(),today=now.getDate();
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  let lead=(first.getDay()+6)%7; // Monday-first
  let h='<div class="mon"><b>'+now.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</b>'+
    '<button class="nav last" aria-label="Previous month">‹</button><button class="nav" aria-label="Next month">›</button></div><div class="grid">';
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>h+='<div class="dow">'+d+'</div>');
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const isToday=d===today;
    const val=isToday?pct(p):(p.hist[d]??null);
    const cls="day"+(isToday?" today":val===null?" future":val===100?" full":"");
    h+='<div class="'+cls+'"><div class="r" style="--p:'+(val??0)+'"><em>'+d+'</em></div></div>';
  }
  h+='</div><div class="legend">'+
     '<span><i class="key" style="background:conic-gradient(var(--violet) 100%,var(--ring-empty) 0)"><em></em></i>Full circle — every task done</span>'+
     '<span><i class="key" style="background:conic-gradient(var(--violet) 50%,var(--ring-empty) 0)"><em></em></i>Part circle — some left undone</span>'+
     '<span><i class="key" style="background:var(--gold)"><em></em></i>Today</span></div>';
  $("#cal").innerHTML=h;
}

/* ============ toast + idle ============ */
function showToast(m){$("#toast-text").textContent=m;$("#toast").classList.add("show");clearTimeout(tt);tt=setTimeout(hideToast,4500);}
function hideToast(){$("#toast").classList.remove("show");}
$("#undo").addEventListener("click",()=>{if(last){last.done=false;last=null;renderPerson();}hideToast();bump();});
function bump(){clearTimeout(idle);idle=setTimeout(()=>{hideToast();close();},30000);}

/* ============ clock ============ */
function tick(){
  const d=new Date();
  $("#famdate").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  $("#clock").textContent=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const r=new Date(d);r.setHours(20,0,0,0);
  const diff=Math.round((r-d)/60000),cd=$("#countdown");
  if(diff>15){const h=Math.floor(diff/60),mm=diff%60;cd.textContent="in "+(h?h+"h ":"")+mm+"m";}
  else if(diff>-15)cd.textContent="Starting now";
  else cd.textContent="Tomorrow 8:00 PM";
}
setInterval(tick,10000);tick();renderFamily();
</script>
