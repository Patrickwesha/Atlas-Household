# Alembic owns database migrations from 0002 onward.
#
# 0001 was applied by hand with migrations/apply.py, so Alembic did not know it
# had happened. Revision 0001_initial_schema is a transcription of
# migrations/0001_init.sql that exists purely so the version graph has an honest
# root; against a database that already ran the .sql it is STAMPED, never run:
#
#     alembic stamp 0001_initial_schema     # once, to start the version table in sync
#     alembic upgrade head                  # applies 0002 and everything after
#
# There is NO sqlalchemy.url here on purpose. env.py resolves the connection from
# DIRECT_URL and refuses a "-pooler" host, so there is no way to accidentally run
# DDL through Neon's transaction pooler, and no connection string in a file that
# lives in a PUBLIC repo. Run alembic from apps/api.

[alembic]
script_location = migrations
version_path_separator = os

# Puts apps/api on sys.path so env.py can `from app.envfile import ...`.
prepend_sys_path = .

# Filenames sort in apply order and read like the slice they belong to:
#   migrations/versions/0002_recurring_chores.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
